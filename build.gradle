import com.github.spotbugs.snom.SpotBugsReport

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.1.3'
	id 'io.spring.dependency-management' version '1.1.3'
	id 'org.graalvm.buildtools.native' version '0.9.24'
	id "com.github.spotbugs" version "4.7.2"
	id "checkstyle"
	id "jacoco"
	id "pmd"
}

group = 'com.tyrell'
version = '0.0.1-SNAPSHOT'

project.ext {
	//	swaggerVersion = '2.0.2'
//	mockServerVersion = '3.10.4'
	jsonVersion = '20180130'
	cucumberVersion = "6.11.0"
	junit5Version = "5.7.2"
	restAssuredVersion = "2.9.0"
	swaggerVersion = "3.0.0"
	assertjVersion = "3.20.2"
	checkStyleToolVersion = "8.41"
//	pmdToolVersion = "6.21.0"
	jacocoToolVersion = "0.8.7"
}

java {
	sourceCompatibility = '17'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	developmentOnly group: "org.springframework.boot", name: "spring-boot-devtools"
//	implementation group: "org.springframework.boot", name: "spring-boot-starter"
	implementation group: "org.springframework.boot", name: "spring-boot-starter-actuator"
	implementation 'com.amazonaws:aws-java-sdk:1.12.548'
	implementation 'org.json:json:20220924'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'


	testImplementation("org.junit.jupiter:junit-jupiter-engine")
//	testImplementation("org.testcontainers:testcontainers:1.17.5")
	testImplementation("org.testcontainers:junit-jupiter:1.17.5")
//	testImplementation("org.testcontainers:mariadb:1.17.5")
//	testImplementation("org.testcontainers:r2dbc:1.17.5")
	testImplementation("org.freemarker:freemarker:2.3.31")

	testImplementation("io.projectreactor:reactor-test")
	testImplementation("org.junit.vintage:junit-vintage-engine:5.9.0")

	testImplementation("io.cucumber:cucumber-java:7.9.0")
	testImplementation("io.cucumber:cucumber-spring:7.9.0")
	testImplementation("io.cucumber:cucumber-junit:7.9.0")
	testImplementation("io.rest-assured:rest-assured")
	testImplementation("io.rest-assured:json-path")
	testImplementation("io.rest-assured:xml-path")
}

tasks.named('test') {
	useJUnitPlatform()
}

sourceSets {
	test {
		java {
			srcDirs 'src/component-test'
			srcDirs 'src/component-test/java'
			srcDirs 'src/test'
		}
	}
	main {
		java {
			srcDirs 'src/main'
		}
	}
}

checkstyle {
	toolVersion checkStyleToolVersion
	ignoreFailures true //set to false for a fail
	showViolations true
	reportsDir = file("$project.buildDir/reports/checkstyle")
	configFile = file("$rootProject.projectDir/config/checkstyle/google_checks.xml")
	maxWarnings = 0
}

jacoco {
	toolVersion = jacocoToolVersion
}

build {
	dependsOn jacocoTestCoverageVerification
}

jacocoTestReport {
	reports {
		xml.required = false
		csv.required = false
		html.outputLocation = layout.buildDirectory.dir("reports/jacocoHtml")
	}
}

jacocoTestCoverageVerification {
	violationRules {
		rule {
			limit {
				minimum = 1.0
			}
			element = "CLASS"
			excludes = ["com.tyrell.replicant.Application",
						"com.tyrell.replicant.config.SwaggerConfiguration",
						"com.tyrell.replicant.service.CryptoDataFetcherRestParameterObject",
						"com.tyrell.replicant.service.CryptoDataFetcherRestParameterObject.CryptoDataFetcherRestParameterObjectBuilder",
						"com.tyrell.replicant.exception.RestExceptionHandler",
						"com.tyrell.replicant.exception.MyException",
						"com.tyrell.replicant.config.MyConfigurationProperties",
						"com.tyrell.replicant.config.YamlPropertySourceFactory"]
		}
	}
}

pmd {
	consoleOutput = true
	ignoreFailures = true //set to false for a fail
//	toolVersion = pmdToolVersion
	rulesMinimumPriority = 5
	maxFailures = 0
	ruleSets = ["category/java/errorprone.xml", "category/java/bestpractices.xml"]
	sourceSets = [sourceSets.main]
}

spotbugs {
	ignoreFailures = true //set to false for a fail
	showStackTraces = true
	showProgress = true
}

spotbugsMain {
	reports(({
		html {
			enabled = true
			destination = file("$buildDir/reports/spotbugs/main/spotbugs.html")
			stylesheet = "fancy-hist.xsl"
		}
		xml {
			enabled = false
		}
	} as Closure<NamedDomainObjectContainer<? extends SpotBugsReport>>))
}

spotbugsTest {
	reports(({
		html {
			enabled = true
			destination = file("$buildDir/reports/spotbugs/test/spotbugs.html")
			stylesheet = "fancy-hist.xsl"
		}
		xml {
			enabled = false
		}
	} as Closure<NamedDomainObjectContainer<? extends SpotBugsReport>>))
}

tasks.withType(Test) {
	scanForTestClasses = false
	include "**/*Test.class"
	exclude "**/RunATDDTest.class"
}

tasks.withType(Checkstyle) {
	source 'src/main/java'
	include '**/*.java'
	exclude 'build/**'
	exclude '**/generated/**'

	// empty classpath
	classpath = rootProject.files()
	reports {
		xml.required = false
		html.required = true
	}
}

//Dynamic exclude through property defined in the build.gradle file
//to run cucumber test use ./gradlew build -Pcomponent-test
test {
	finalizedBy jacocoTestReport
	jacoco {
		destinationFile = file("$buildDir/jacoco/jacocoTest.exec")
		classDumpDir = file("$buildDir/jacoco/classpathdumps")
	}
	if (project.hasProperty('component-test')) {
		include "**/RunATDDTest.class"
		exclude "**/*Test.class"
	}
}

task ct(type: Exec) {
	commandLine "./gradlew", "clean", "build", "-x", "checkstyleAot", "-x", "checkstyleAotTest", "-x", "checkstyleMain", "-x", "checkstyleTest", "-x", "pmdMain", "-x", "jacocoTestCoverageVerification", "-x", "spotbugsAot",  "-x", "spotbugsTest","-x", "spotbugsMain", "-x", "spotbugsAotTest","-Pcomponent-test"
}

task ut(type: Exec) {
	commandLine './ut.sh'
}

project.gradle.startParameter.excludedTaskNames.add('checkstyleAot')
project.gradle.startParameter.excludedTaskNames.add('checkstyleAotTest')

