import com.github.spotbugs.snom.SpotBugsReport

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'org.graalvm.buildtools.native' version '0.9.28'
	id "com.github.spotbugs" version "5.2.5"
	id "checkstyle"
	id "jacoco"
	id "pmd"
}

group = 'com.tyrell'
version = '0.0.1-SNAPSHOT'

project.ext {
	//	swaggerVersion = '2.0.2'
	jsonVersion = '20180130'
	cucumberVersion = "7.20.0" // Stable version compatible with Spring Boot 3.5.4 AOT processing
	junit5Version = "5.11.3"
	restAssuredVersion = "5.5.0"
	swaggerVersion = "3.0.0"
	assertjVersion = "3.26.3"
	checkStyleToolVersion = "9.3"
	jacocoToolVersion = "0.8.11"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}


configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "software.amazon.awssdk:bom:2.21.29"
        mavenBom "org.junit:junit-bom:5.12.2"
    }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	developmentOnly group: "org.springframework.boot", name: "spring-boot-devtools"
	implementation group: "org.springframework.boot", name: "spring-boot-starter-actuator"

	// AWS SDK v2 Dependencies - using explicit versions to avoid resolution issues
	implementation 'software.amazon.awssdk:s3:2.21.29'
	implementation 'software.amazon.awssdk:auth:2.21.29'

	implementation 'org.json:json:20220924'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation('org.springframework.boot:spring-boot-starter-test')
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'

	testImplementation("org.testcontainers:junit-jupiter:1.17.5")
	testImplementation("org.freemarker:freemarker:2.3.31")

	testImplementation("io.projectreactor:reactor-test")

	// Cucumber 7.20.0 - stable version compatible with Spring Boot 3.5.4
	testImplementation("io.cucumber:cucumber-java:7.20.0")
	testImplementation("io.cucumber:cucumber-spring:7.20.0")
	testImplementation("io.cucumber:cucumber-junit-platform-engine:7.20.0")
	testImplementation("org.junit.platform:junit-platform-suite")

	testImplementation("io.rest-assured:rest-assured")
	testImplementation("io.rest-assured:json-path")
	testImplementation("io.rest-assured:xml-path")
}

tasks.named('test') {
	useJUnitPlatform()
}

sourceSets {
	test {
		java {
			srcDirs 'src/component-test'
			srcDirs 'src/component-test/java'
			srcDirs 'src/test'
		}
	}
	main {
		java {
			srcDirs 'src/main'
		}
	}
}

checkstyle {
	toolVersion checkStyleToolVersion
	ignoreFailures true //set to false for a fail
	showViolations true
	reportsDir = file("$project.buildDir/reports/checkstyle")
	configFile = file("$rootProject.projectDir/config/checkstyle/google_checks.xml")
	maxWarnings = 0
}

jacoco {
	toolVersion = jacocoToolVersion
}

build {
	dependsOn jacocoTestCoverageVerification
}

jacocoTestReport {
	reports {
		xml.required = false
		csv.required = false
		html.outputLocation = layout.buildDirectory.dir("reports/jacocoHtml")
	}
}

jacocoTestCoverageVerification {
	violationRules {
		rule {
			limit {
				minimum = 1.0
			}
			element = "CLASS"
			excludes = ["com.tyrell.replicant.Application",
						"com.tyrell.replicant.ReplicantApplication",
						"com.tyrell.replicant.config.SwaggerConfiguration",
						"com.tyrell.replicant.config.BucketName",
						"com.tyrell.replicant.config.AmazonConfig",
						"com.tyrell.replicant.s3connector.service.CryptoDataFetcherRestParameterObject",
						"com.tyrell.replicant.s3connector.service.CryptoDataFetcherRestParameterObject.CryptoDataFetcherRestParameterObjectBuilder",
						"com.tyrell.replicant.s3connector.S3ConnectorService",
						"com.tyrell.replicant.s3connector.Request",
						"com.tyrell.replicant.s3connector.S3ConnectorController",
						"com.tyrell.replicant.s3connector.Image",
						"com.tyrell.replicant.s3connector.FileStore",
						"com.tyrell.replicant.s3connector.Request.RequestBuilder",
						"com.tyrell.replicant.s3connector.Image.ImageBuilder",
						"com.tyrell.replicant.exception.RestExceptionHandler",
						"com.tyrell.replicant.exception.MyException",
						"com.tyrell.replicant.config.MyConfigurationProperties",
						"com.tyrell.replicant.config.YamlPropertySourceFactory"]
		}
	}
}

pmd {
	consoleOutput = true
	ignoreFailures = true //set to false for a fail
//	toolVersion = pmdToolVersion
	rulesMinimumPriority = 5
	maxFailures = 0
	ruleSets = ["category/java/errorprone.xml", "category/java/bestpractices.xml"]
	sourceSets = [sourceSets.main]
}

spotbugs {
	ignoreFailures = true //set to false for a fail
	showStackTraces = true
	showProgress = true
}

spotbugsMain {
	reports(({
		html {
			enabled = true
			destination = file("$buildDir/reports/spotbugs/main/spotbugs.html")
			stylesheet = "fancy-hist.xsl"
		}
		xml {
			enabled = false
		}
	} as Closure<NamedDomainObjectContainer<? extends SpotBugsReport>>))
}

spotbugsTest {
	reports(({
		html {
			enabled = true
			destination = file("$buildDir/reports/spotbugs/test/spotbugs.html")
			stylesheet = "fancy-hist.xsl"
		}
		xml {
			enabled = false
		}
	} as Closure<NamedDomainObjectContainer<? extends SpotBugsReport>>))
}

tasks.withType(Test) {
	scanForTestClasses = false
	if (!project.hasProperty('component-test')) {
		include "**/*Test.class"
		exclude "**/ATRunner.class"
	}
}

tasks.withType(Checkstyle) {
	source 'src/main/java'
	include '**/*.java'
	exclude 'build/**'
	exclude '**/generated/**'

	// empty classpath
	classpath = rootProject.files()
	reports {
		xml.required = false
		html.required = true
	}
}

test {
	finalizedBy jacocoTestReport
	jacoco {
		destinationFile = file("$buildDir/jacoco/jacocoTest.exec")
		classDumpDir = file("$buildDir/jacoco/classpathdumps")
	}
	if (project.hasProperty('component-test')) {
		include "**/ATRunner.class"
		exclude "**/*Test.class"
	}
}

tasks.named("test") {
	useJUnitPlatform()
	systemProperty("cucumber.publish.quiet", "false")
}

test {
	testLogging {
		events "passed", "skipped", "failed", "standardOut", "standardError"
	}
}

task ct(type: Exec) {
	commandLine "./gradlew", "clean", "build", "-Pcomponent-test", "-x", "checkstyleAot", "-x", "checkstyleAotTest", "-x", "checkstyleMain", "-x", "checkstyleTest", "-x", "pmdMain", "-x", "jacocoTestCoverageVerification", "-x", "spotbugsAot",  "-x", "spotbugsTest","-x", "spotbugsMain", "-x", "spotbugsAotTest"
}

task ut(type: Exec) {
	commandLine './ut.sh'
}

project.gradle.startParameter.excludedTaskNames.add('checkstyleAot')
project.gradle.startParameter.excludedTaskNames.add('checkstyleAotTest')

